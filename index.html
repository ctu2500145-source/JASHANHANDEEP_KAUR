<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Savora Kitchen Chatbot</title>
  <style>
    /* Optional: Style the page */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f8f8f8;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      background-color: #ff6f61;
      color: white;
      padding: 20px;
      text-align: center;
    }
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    h1 {
      margin: 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to Savora Kitchen</h1>
  </header>

  <main>
    <p>Chat with our assistant for recipes, cooking tips, and more!</p>
  </main>

  <!-- Watson Assistant Chat Embed -->
  <script>
    window.watsonAssistantChatOptions = {
      integrationID: "68ac37dc-167c-4ea0-909e-e33945d38751", // The ID of this integration.
      region: "au-syd", // The region your integration is hosted in.
      serviceInstanceID: "3a165011-6328-4a2e-8010-7abd32a5932c", // The ID of your service instance.
      onLoad: async (instance) => { await instance.render(); }
    };
    setTimeout(function(){
      const t = document.createElement('script');
      t.src = "https://web-chat.global.assistant.watson.appdomain.cloud/versions/" + 
              (window.watsonAssistantChatOptions.clientVersion || 'latest') + 
              "/WatsonAssistantChatEntry.js";
      document.head.appendChild(t);
    });
  </script>
</body>
</html>
